name: Release

# Issue #86 release contract:
# - A signed version tag triggers a concurrency-locked workflow.
# - The built candidates (DEB, Unified RPM, optional AppImage, source archive,
#   SRPM, XBPS, repository metadata and provenance) are produced exactly once from the tagged source and carried
#   unchanged through verification, draft assembly, and publication. No
#   downstream job rebuilds, repacks, or renames them.
# - A release manifest binds each candidate to its SHA-256, source revision,
#   build identity, and verification results; the checksum inventory covers
#   all candidates plus the manifest and is detached-armored-signed in the
#   protected promotion step.
# - Candidates are assembled into a private draft. Promotion of the unchanged
#   draft happens only through the protected `release-promotion` environment
#   (maintainer approval) via workflow_dispatch.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      evidence_ref:
        description: 'Full commit ID containing evidence/release-acceptance.json (promotion only)'
        required: false
      promote_draft:
        description: 'Promote the existing draft release (requires tag)'
        required: false
        default: 'false'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CANDIDATES_DIR: release-candidates

jobs:
  # ── Pre-flight validation (before any candidate is built) ───────────────────────────────

  preflight:
    if: github.event.inputs.promote_draft != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag version matches Meson version
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          MESON_VERSION=$(sed -n "s/.*version: '\([0-9.]*\)'.*/\1/p" meson.build | head -1)
          echo "Tag: $TAG_VERSION  Meson: $MESON_VERSION"
          test "$TAG_VERSION" = "$MESON_VERSION"

      - name: Validate tag version matches RPM spec version
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          SPEC_VERSION=$(sed -n 's/^Version:\s*\([0-9.]*\)/\1/p' packaging/threshold.spec | head -1)
          echo "Tag: $TAG_VERSION  Spec: $SPEC_VERSION"
          test "$TAG_VERSION" = "$SPEC_VERSION"

      - name: Validate Void and Debian versions
        run: |
          V=${GITHUB_REF_NAME#v}
          test "$(sed -n 's/^version=//p' packaging/void/template)" = "$V"
          head -1 debian/changelog | grep -F "threshold ($V-1)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify committed offline web bundle
        run: |
          cd web
          npm ci
          npm run build
          test -z "$(git status --porcelain dist/)"

      - name: Validate EC manifest checksum matches vendored source
        # Must match the exact algorithm used by
        # packaging/threshold-ec-lifecycle's installed_source_checksum()
        # (a single sha256 over sorted "path\n" + file-bytes, not a hash
        # of per-file hashes) and tests/test_packaging_versions.py's
        # _vendored_checksum(), or this check verifies nothing.
        run: |
          python3 -c "
          import hashlib, json
          from pathlib import Path
          manifest = json.load(open('packaging/ec-manifest.json'))['msi_ec']
          h = hashlib.sha256()
          root = Path('.')
          source_dir = root / manifest['source_dir']
          for p in sorted(p for p in source_dir.rglob('*') if p.is_file()):
              h.update(f'{p.relative_to(root)}\n'.encode())
              h.update(p.read_bytes())
          vendored = h.hexdigest()
          print(f'Manifest: {manifest[\"checksum\"]}')
          print(f'Vendored: {vendored}')
          assert manifest['checksum'] == vendored
          "

      - name: Validate canonical filenames will use tag version
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          echo "Canonical names: Threshold-$TAG_VERSION.tar.gz, threshold_${TAG_VERSION}_amd64.deb"
          test -f debian/control
          grep -q "threshold" debian/control

  # ── Source archive (built once, consumed by DEB and RPM) ─────────────────────────────

  source:
    if: github.event.inputs.promote_draft != 'true'
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build canonical source archive
        run: |
          V=${GITHUB_REF_NAME#v}
          git archive --format=tar --prefix="Threshold-$V/" HEAD | gzip -n > "Threshold-$V.tar.gz"
          echo "Built: Threshold-$V.tar.gz"
          ls -l "Threshold-$V.tar.gz"

      - name: Upload source archive candidate
        uses: actions/upload-artifact@v4
        with:
          name: candidate-source
          path: Threshold-*.tar.gz
          retention-days: 7
          if-no-files-found: error

  # ── Candidate build (once) ───────────────────────────────────────────────────────────

  deb:
    if: github.event.inputs.promote_draft != 'true'
    needs: [preflight, source]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download source archive
        uses: actions/download-artifact@v4
        with:
          name: candidate-source
          path: source-archive

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev lintian

      - name: Install build dependencies
        run: sudo apt-get build-dep -y .

      - name: Build .deb candidate from canonical source
        run: |
          V=${GITHUB_REF_NAME#v}
          mkdir /tmp/canonical-deb
          tar -xzf source-archive/Threshold-*.tar.gz -C /tmp/canonical-deb
          (cd "/tmp/canonical-deb/Threshold-$V" && dpkg-buildpackage -us -uc -b)
          mkdir -p ${{ env.CANDIDATES_DIR }}
          cp /tmp/canonical-deb/threshold_*_amd64.deb ${{ env.CANDIDATES_DIR }}/

      - name: Lintian
        run: lintian ${{ env.CANDIDATES_DIR }}/*.deb

      - name: Record candidate checksum
        run: (cd ${{ env.CANDIDATES_DIR }} && sha256sum *) > /tmp/candidate.sha256 && mv /tmp/candidate.sha256 ${{ env.CANDIDATES_DIR }}/candidate.sha256

      - name: Upload DEB candidate
        uses: actions/upload-artifact@v4
        with:
          name: candidate-deb
          path: |
            ${{ env.CANDIDATES_DIR }}/*.deb
            ${{ env.CANDIDATES_DIR }}/candidate.sha256
          retention-days: 7
          if-no-files-found: error

  rpm:
    if: github.event.inputs.promote_draft != 'true'
    needs: [preflight, source]
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: |
          dnf -y install git rpm-build \
            meson ninja-build pkgconf-pkg-config gettext \
            gtk4-devel libadwaita-devel python3-devel python3-gobject \
            desktop-file-utils libappstream-glib systemd-rpm-macros

      - uses: actions/checkout@v4

      - name: Download source archive
        uses: actions/download-artifact@v4
        with:
          name: candidate-source
          path: source-archive

      - name: Build Unified RPM + SRPM from canonical source
        run: |
          V=${GITHUB_REF_NAME#v}
          mkdir -p rpmbuild/{SOURCES,SPECS,RPMS/noarch,SRPMS,BUILD}
          cp source-archive/Threshold-*.tar.gz rpmbuild/SOURCES/
          cp packaging/threshold.sysusers rpmbuild/SOURCES/
          cp packaging/threshold.spec rpmbuild/SPECS/
          rpmbuild -ba --define "_topdir $PWD/rpmbuild" rpmbuild/SPECS/threshold.spec
          mkdir -p ${{ env.CANDIDATES_DIR }}
          cp rpmbuild/RPMS/noarch/threshold-*.noarch.rpm ${{ env.CANDIDATES_DIR }}/
          cp rpmbuild/SRPMS/*.src.rpm ${{ env.CANDIDATES_DIR }}/
          cp source-archive/Threshold-*.tar.gz ${{ env.CANDIDATES_DIR }}/

      - name: Record candidate checksums
        run: (cd ${{ env.CANDIDATES_DIR }} && sha256sum *) > /tmp/candidate.sha256 && mv /tmp/candidate.sha256 ${{ env.CANDIDATES_DIR }}/candidate.sha256

      - name: Upload RPM candidates
        uses: actions/upload-artifact@v4
        with:
          name: candidate-rpm
          path: |
            ${{ env.CANDIDATES_DIR }}/*
          retention-days: 7
          if-no-files-found: error

  appimage:
    if: github.event.inputs.promote_draft != 'true'
    needs: [preflight, source]
    runs-on: ubuntu-24.04
    # Temporarily allowed to fail: the EC bundle trust key
    # (packaging/trust/README.md) is documented but not yet wired into
    # any package's install list, including the AppImage's own AppDir,
    # so THRESHOLD_EC_SIGNING_KEY has nowhere to be verified at runtime
    # even once it's set. Remove this once that packaging work lands.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Download source archive
        uses: actions/download-artifact@v4
        with:
          name: candidate-source
          path: source-archive

      - name: Install AppImage build dependencies
        run: |
          sudo apt-get update
          # Mirrors debian/control's Build-Depends: meson.build hard-requires
          # gtk4 and libadwaita-1, and build-appimage.sh bundles their GI
          # typelibs + shared libraries (plus Notify) into the AppDir for
          # offline startup, so all of these must be present at build time,
          # not just the minimal meson/wget toolchain.
          sudo apt-get install -y meson ninja-build python3-gi gir1.2-dbusmenu-glib-0.4 \
            libgirepository1.0-dev wget libgtk-4-dev libadwaita-1-dev \
            gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-notify-0.7 libnotify-dev
          wget -qO appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          sudo mv appimagetool /usr/local/bin/

      - name: Build AppImage candidate (twice, verify reproducibility)
        run: |
          set -e
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          ./packaging/appimage/build-appimage.sh /tmp/threshold-1.AppImage
          rm -rf build/appimage-src
          ./packaging/appimage/build-appimage.sh /tmp/threshold-2.AppImage
          A=$(sha256sum /tmp/threshold-1.AppImage | awk '{print $1}')
          B=$(sha256sum /tmp/threshold-2.AppImage | awk '{print $1}')
          if [ "$A" != "$B" ]; then
            echo "AppImage is not reproducible: $A != $B"
            exit 1
          fi
          mkdir -p ${{ env.CANDIDATES_DIR }}
          V=${GITHUB_REF_NAME#v}
          cp /tmp/threshold-1.AppImage "${{ env.CANDIDATES_DIR }}/Threshold-$V-x86_64.AppImage"
          (cd ${{ env.CANDIDATES_DIR }} && sha256sum *.AppImage) > /tmp/appimage.sha256
          mv /tmp/appimage.sha256 ${{ env.CANDIDATES_DIR }}/appimage.sha256

      - name: Upload AppImage candidate
        uses: actions/upload-artifact@v4
        with:
          name: candidate-appimage
          path: |
            ${{ env.CANDIDATES_DIR }}/*.AppImage
            ${{ env.CANDIDATES_DIR }}/appimage.sha256
          retention-days: 7
          if-no-files-found: error

  xbps:
    if: github.event.inputs.promote_draft != 'true'
    needs: [preflight, source]
    runs-on: ubuntu-24.04
    container: ghcr.io/void-linux/void-glibc-full@sha256:abfccb6abc1462d9e1fcf19d1e76b40d770d10a251be4340d1a46edfb5b35041
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: candidate-source
          path: source-archive
      - name: Build exact-source XBPS and local repository
        run: bash scripts/build-void-candidate.sh "$PWD" "$PWD/source-archive/Threshold-${GITHUB_REF_NAME#v}.tar.gz" "$PWD/xbps-candidate"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-xbps
          path: xbps-candidate/*
          if-no-files-found: error
          retention-days: 30

  xbps-verify:
    needs: xbps
    runs-on: ubuntu-24.04
    container: ghcr.io/void-linux/void-glibc-full@sha256:abfccb6abc1462d9e1fcf19d1e76b40d770d10a251be4340d1a46edfb5b35041
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: candidate-xbps
          path: candidates
      - name: Install, reinstall, and remove the unchanged XBPS
        run: bash scripts/verify-void-candidate.sh "$PWD/candidates" "$PWD/void-verification.json"
      - uses: actions/upload-artifact@v4
        with:
          name: verification-xbps
          path: void-verification.json
          if-no-files-found: error
          retention-days: 30

  # ── Candidate verification (against the immutable artifacts) ──────────────────────────────

  deb-verify:
    needs: deb
    runs-on: ubuntu-24.04
    steps:
      - name: Download DEB candidate
        uses: actions/download-artifact@v4
        with:
          name: candidate-deb
          path: candidates

      - name: Verify candidate checksum
        run: |
          (cd candidates && sha256sum *.deb) > got.sha256
          grep -F "$(awk '{print $1}' candidates/candidate.sha256 | head -1)" got.sha256

      - name: Install the exact DEB
        run: |
          # Azure's Ubuntu mirror has repeatedly 404'd on specific
          # webkit-transitive packages (gstreamer plugins, xdg-desktop-
          # portal) here while the index still lists them; retry once
          # against a refreshed index before giving up.
          sudo apt-get install -y ./candidates/threshold_*_amd64.deb || {
            echo "First install attempt failed, refreshing index and retrying..."
            sudo apt-get update
            sudo apt-get install -y ./candidates/threshold_*_amd64.deb
          }

      - name: Check installed layout
        run: |
          set -e
          # Application binary
          test -x /usr/bin/threshold
          # EC lifecycle authority
          test -x /usr/sbin/threshold-ec-lifecycle
          # Boot reconciliation systemd unit
          test -f /usr/lib/systemd/system/threshold-boot-reconcile.service
          # Vendored msi-ec DKMS source tree
          test -d /usr/src/msi-ec-0.13.112
          # Notification-area icons
          test -f /usr/share/icons/hicolor/scalable/apps/com.bongbetic.threshold.svg
          test -f /usr/share/icons/hicolor/scalable/status/com.bongbetic.threshold-battery-good.svg
          test -f /usr/share/icons/hicolor/symbolic/apps/com.bongbetic.threshold-symbolic.svg
          # GSettings schemas (both current + legacy)
          test -f /usr/share/glib-2.0/schemas/com.bongbetic.threshold.gschema.xml
          test -f /usr/share/glib-2.0/schemas/com.bongbetic.batteryguard.gschema.xml
          # Desktop + metainfo
          test -f /usr/share/applications/com.bongbetic.threshold.desktop
          test -f /usr/share/metainfo/com.bongbetic.threshold.metainfo.xml
          # udev rule
          test -f /usr/lib/udev/rules.d/99-msi-battery.rules
          # Web UI
          test -d /usr/share/com.bongbetic.threshold/web/

      - name: Verify package ownership of key files
        run: |
          set -e
          dpkg -S /usr/bin/threshold
          dpkg -S /usr/sbin/threshold-ec-lifecycle
          dpkg -S /usr/lib/systemd/system/threshold-boot-reconcile.service
          dpkg -S /usr/src/msi-ec-0.13.112
          dpkg -S /usr/share/icons/hicolor/scalable/apps/com.bongbetic.threshold.svg
          dpkg -S /usr/share/glib-2.0/schemas/com.bongbetic.threshold.gschema.xml
          dpkg -S /usr/lib/udev/rules.d/99-msi-battery.rules

      - name: Verify lifecycle installs package-owned marker
        run: |
          test -f /var/lib/threshold/ec/package-owned

      - name: Verify upgrade preserves charge threshold
        run: |
          # Simulate a prior charge threshold preference
          sudo mkdir -p /var/lib/threshold/ec
          echo "80" | sudo tee /var/lib/threshold/ec/charge-threshold > /dev/null
          # Re-install (upgrade path: same version triggers configure again)
          sudo dpkg --configure threshold || true
          # Charge threshold must survive
          test -f /var/lib/threshold/ec/charge-threshold
          test "80" = "$(cat /var/lib/threshold/ec/charge-threshold)"

      - name: Verify removal preserves EC state
        run: |
          # Record state before removal
          test -f /var/lib/threshold/ec/charge-threshold
          THRESHOLD_BEFORE=$(cat /var/lib/threshold/ec/charge-threshold)
          # Remove (not purge)
          sudo dpkg --remove threshold || sudo dpkg --purge --force-remove-reinstreq threshold || true
          # Charge threshold must survive ordinary removal
          test -f /var/lib/threshold/ec/charge-threshold
          test "$THRESHOLD_BEFORE" = "$(cat /var/lib/threshold/ec/charge-threshold)"

      - name: Re-install for purge test
        run: sudo apt-get install -y ./candidates/threshold_*_amd64.deb

      - name: Verify purge removes retained state
        run: |
          # Write a preference that should only be cleared on purge
          sudo mkdir -p /var/lib/threshold/ec
          echo "75" | sudo tee /var/lib/threshold/ec/charge-threshold > /dev/null
          # Purge
          sudo dpkg --purge threshold
          # /var/lib/threshold must be fully removed on purge
          test ! -d /var/lib/threshold/ec
  rpm-verify:
    needs: rpm
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: fedora:44
            tool: dnf
          - container: opensuse/tumbleweed:latest
            tool: zypper
    container: ${{ matrix.container }}
    steps:
      - name: Download RPM candidates
        uses: actions/download-artifact@v4
        with:
          name: candidate-rpm
          path: candidates

      - name: Record checksums under test
        run: (cd candidates && sha256sum *.rpm) > sha256s.txt

      - name: Install the exact Unified RPM via ${{ matrix.tool }}
        run: |
          if [ "${{ matrix.tool }}" = "dnf" ]; then
            dnf -y install --setopt=optional_metadata_types=filelists candidates/threshold-*.noarch.rpm
          else
            zypper -n --no-gpg-checks install candidates/threshold-*.noarch.rpm
          fi

      - name: Check installed layout
        run: |
          set -e
          # Application binary
          test -x /usr/bin/threshold
          # EC lifecycle authority (merged-usr distros define _sbindir as
          # /usr/bin; see ci.yml's rpm job for the same accommodation)
          test -x /usr/sbin/threshold-ec-lifecycle || test -x /usr/bin/threshold-ec-lifecycle
          # Vendored msi-ec source
          test -d /usr/src/msi-ec-0.13.112
          # Boot reconciliation systemd unit
          test -f /usr/lib/systemd/system/threshold-boot-reconcile.service
          # Notification-area status icons (at least one non-charging + one charging)
          test -f /usr/share/icons/hicolor/scalable/status/com.bongbetic.threshold-battery-good.svg
          test -f /usr/share/icons/hicolor/scalable/status/com.bongbetic.threshold-battery-good-charging.svg
          # App icon + symbolic icon
          test -f /usr/share/icons/hicolor/scalable/apps/com.bongbetic.threshold.svg
          test -f /usr/share/icons/hicolor/symbolic/apps/com.bongbetic.threshold-symbolic.svg
          # sysusers.d config
          test -f /usr/lib/sysusers.d/threshold.conf
          # udev rules (plugdev rewritten to threshold)
          test -f /usr/lib/udev/rules.d/99-msi-battery.rules
          grep -q 'threshold' /usr/lib/udev/rules.d/99-msi-battery.rules
          # GSettings schemas (both current + legacy)
          test -f /usr/share/glib-2.0/schemas/com.bongbetic.threshold.gschema.xml
          test -f /usr/share/glib-2.0/schemas/com.bongbetic.batteryguard.gschema.xml
          # Desktop + metainfo
          test -f /usr/share/applications/com.bongbetic.threshold.desktop
          test -f /usr/share/metainfo/com.bongbetic.threshold.metainfo.xml

  appimage-verify:
    needs: appimage
    runs-on: ubuntu-24.04
    # See the continue-on-error note on the appimage job above.
    continue-on-error: true
    steps:
      - name: Download AppImage candidate
        uses: actions/download-artifact@v4
        with:
          name: candidate-appimage
          path: candidates

      - name: Canonical AppImage startup check
        run: |
          chmod +x candidates/*.AppImage
          candidates/*.AppImage --appimage-extract >/dev/null
          test -f squashfs-root/AppRun
          test -f squashfs-root/usr/share/threshold/ec-bundle/manifest.json
          # Dependency closure: compiled GSettings schemas
          test -f squashfs-root/usr/share/glib-2.0/schemas/gschemas.compiled
          # Dependency closure: core GI typelibs
          for tl in GLib-2.0 GObject-2.0 Gio-2.0 Gtk-4.0 Adw-1 Notify-0.7; do
            test -f "squashfs-root/usr/lib/girepository-1.0/${tl}.typelib"
          done
          # Dependency closure: AppRun sets offline environment variables
          grep -q GSETTINGS_SCHEMA_DIR squashfs-root/AppRun
          grep -q XDG_DATA_DIRS squashfs-root/AppRun
          grep -q GI_TYPELIB_PATH squashfs-root/AppRun
          grep -q LD_LIBRARY_PATH squashfs-root/AppRun
          # No build-host paths in AppRun
          ! grep -q '/home/' squashfs-root/AppRun
          ! grep -q '/tmp/' squashfs-root/AppRun

  # ── Draft assembly (manifest + checksums, private) ─────────────────────────────────

  assemble-draft:
    if: github.event.inputs.promote_draft != 'true'
    needs: [deb, rpm, appimage, source, deb-verify, rpm-verify, appimage-verify, xbps, xbps-verify]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all candidates
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect exactly the built candidates (no rebuilds, no renames)
        run: |
          mkdir -p ${{ env.CANDIDATES_DIR }}
          find dist -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
            -o -name '*.tar.gz' -o -name '*.src.rpm' -o -name '*.xbps' \
            -o -name 'x86_64-repodata' -o -name 'void-build.json' -o -name 'void-dependencies.txt' \) -exec cp {} ${{ env.CANDIDATES_DIR }}/ \;
          ls -l ${{ env.CANDIDATES_DIR }}
          COUNT=$(ls ${{ env.CANDIDATES_DIR }} | wc -l)
          echo "Candidate count: $COUNT"
          # Eight required files; optional AppImage makes nine.
          # Exact names and cardinality are enforced by the inventory validator.
          test "$COUNT" -ge 8

      - name: Verify candidate hashes against recorded build checksums
        run: |
          cd ${{ env.CANDIDATES_DIR }}
          for rec in ../dist/candidate-*/candidate.sha256 ../dist/candidate-appimage/appimage.sha256; do
            [ -f "$rec" ] || continue
            dir=$(dirname "$rec"); name=$(basename "$rec")
            # Each recorded hash must still match the candidate being promoted.
            while read -r h f; do
              got=$(sha256sum "$f" | awk '{print $1}')
              if [ "$got" != "$h" ]; then
                echo "HASH MISMATCH for candidate $f (recorded=$h promoted=$got)"
                exit 1
              fi
            done < "$dir/$name"
          done

      - name: Validate candidate names are canonical
        run: |
          cd ${{ env.CANDIDATES_DIR }}
          V=${GITHUB_REF_NAME#v}
          # Source archive must use Threshold-<version>.tar.gz
          ls "Threshold-$V.tar.gz"
          # DEB must use threshold_<version>-<debian-revision>_amd64.deb
          ls threshold_${V}-*_amd64.deb
          # RPM must use threshold-<version> or threshold-<version>-*
          ls threshold-$V*.noarch.rpm

      - name: Generate release manifest and checksum inventory
        # source_revision, build_identity and sha256 are validated by the inventory tool.
        # No supported-distribution, desktop or physical success is inferred from package CI.
        run: |
          python3 scripts/release_inventory.py manifest "$CANDIDATES_DIR" \
            --version "${GITHUB_REF_NAME#v}" --revision "$(git rev-parse HEAD)" \
            --identity "$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          python3 scripts/release_inventory.py verify "$CANDIDATES_DIR" \
            --version "${GITHUB_REF_NAME#v}" --revision "$(git rev-parse HEAD)"

      - name: Assemble protected draft
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.CANDIDATES_DIR }}/*.deb
            ${{ env.CANDIDATES_DIR }}/*.rpm
            ${{ env.CANDIDATES_DIR }}/*.src.rpm
            ${{ env.CANDIDATES_DIR }}/*.AppImage
            ${{ env.CANDIDATES_DIR }}/*.tar.gz
            ${{ env.CANDIDATES_DIR }}/*.xbps
            ${{ env.CANDIDATES_DIR }}/x86_64-repodata
            ${{ env.CANDIDATES_DIR }}/void-build.json
            ${{ env.CANDIDATES_DIR }}/void-dependencies.txt
            ${{ env.CANDIDATES_DIR }}/release-manifest.json
            ${{ env.CANDIDATES_DIR }}/SHA256SUMS
          generate_release_notes: true
          draft: true
          make_latest: false

  # ── Physical gate: MSI Thin A15 B7UCX evidence validation ──────────────────────

  physical-gate-check:
    if: github.event.inputs.promote_draft == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Require an immutable evidence revision
        env:
          EVIDENCE_REF: ${{ inputs.evidence_ref }}
        run: test "${#EVIDENCE_REF}" -eq 40 && [[ "$EVIDENCE_REF" =~ ^[0-9a-f]+$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.evidence_ref }}
          path: acceptance
          persist-credentials: false
      - name: Validate actual draft assets and fresh physical evidence
        run: |
          gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft | grep -x true
          gh release download "$GITHUB_REF_NAME" --dir draft
          python3 scripts/release_inventory.py physical draft \
            --version "${GITHUB_REF_NAME#v}" --revision "$(git rev-parse HEAD)" \
            --evidence acceptance/evidence/release-acceptance.json

  promote:
    if: github.event.inputs.promote_draft == 'true' && startsWith(github.ref, 'refs/tags/v')
    needs: [physical-gate-check]
    runs-on: ubuntu-24.04
    environment: release-promotion
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.evidence_ref }}
          path: acceptance
          persist-credentials: false
      - name: Re-verify, sign, and publish the unchanged draft
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          gh release view "$TAG" --json isDraft --jq .isDraft | grep -x true
          gh release download "$TAG" --dir draft
          python3 scripts/release_inventory.py physical draft \
            --version "${TAG#v}" --revision "$(git rev-parse HEAD)" \
            --evidence acceptance/evidence/release-acceptance.json
          export GNUPGHOME=$(mktemp -d)
          chmod 700 "$GNUPGHOME"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s' "$RELEASE_SIGNING_KEY" | gpg --batch --import
          if [ -f draft/SHA256SUMS.asc ]; then
            gpg --verify draft/SHA256SUMS.asc draft/SHA256SUMS
          else
            gpg --batch --detach-sign --armor draft/SHA256SUMS
            gh release upload "$TAG" draft/SHA256SUMS.asc
          fi
          # Download once more after signing, catching changes while awaiting promotion.
          gh release download "$TAG" --dir final-draft
          cmp draft/SHA256SUMS final-draft/SHA256SUMS
          gpg --verify final-draft/SHA256SUMS.asc final-draft/SHA256SUMS
          python3 scripts/release_inventory.py physical final-draft \
            --version "${TAG#v}" --revision "$(git rev-parse HEAD)" \
            --evidence acceptance/evidence/release-acceptance.json
          gh release edit "$TAG" --draft=false --latest
