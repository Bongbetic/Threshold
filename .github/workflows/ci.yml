name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            pkg-config \
            desktop-file-utils \
            gettext \
            gobject-introspection \
            python3 \
            python3-gi \
            python3-pytest \
            python3-pytest-cov \
            flake8 \
            blueprint-compiler \
            appstream \
            libgtk-4-dev \
            libadwaita-1-dev \
            gir1.2-notify-0.7

      - name: Configure
        run: meson setup builddir

      - name: Compile
        run: meson compile -C builddir

      - name: Test
        run: meson test -C builddir --print-errorlogs

      - name: Coverage (battery.py ≥ 80%)
        run: |
          PYTHONPATH=src python3 -m pytest tests/test_battery.py tests/test_window_ui.py -q \
            --cov=threshold.battery \
            --cov-fail-under=80 \
            --cov-report=term-missing

      - name: Lint
        run: flake8 src/threshold tests

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: threshold-build-${{ matrix.os }}
          path: builddir/
          retention-days: 7

  deb-package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev lintian

      - name: Install build dependencies
        run: sudo apt-get build-dep -y .

      - name: Build .debs
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p artifacts
          cp ../threshold_*.deb ../msi-ec-dkms_*.deb artifacts/

      - name: Lintian
        run: lintian artifacts/*.deb

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: threshold-deb-${{ matrix.os }}
          path: artifacts/*.deb
          retention-days: 14
          if-no-files-found: error

  debian-13:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            passwd \
            util-linux \
            meson \
            ninja-build \
            pkg-config \
            desktop-file-utils \
            gettext \
            gobject-introspection \
            python3 \
            python3-gi \
            python3-pytest \
            python3-pytest-cov \
            flake8 \
            blueprint-compiler \
            appstream \
            libgtk-4-dev \
            libadwaita-1-dev \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            gir1.2-notify-0.7 \
            dpkg-dev \
            debhelper-compat \
            dh-python \
            dkms \
            lintian

      - name: Prepare non-root build user
        run: |
          useradd --create-home ci
          chown -R ci:ci "$GITHUB_WORKSPACE"
          chown ci:ci "$(dirname "$GITHUB_WORKSPACE")"

      - name: Configure
        run: runuser -u ci -- meson setup builddir

      - name: Compile
        run: runuser -u ci -- meson compile -C builddir

      - name: Test
        run: runuser -u ci -- meson test -C builddir --print-errorlogs

      - name: Coverage (battery.py ≥ 80%)
        run: |
          runuser -u ci -- env PYTHONPATH=src python3 -m pytest \
            tests/test_battery.py tests/test_window_ui.py -q \
            --cov=threshold.battery \
            --cov-fail-under=80 \
            --cov-report=term-missing

      - name: Lint
        run: runuser -u ci -- flake8 src/threshold tests

      - name: Build .debs
        run: |
          runuser -u ci -- dpkg-buildpackage -us -uc -b
          mkdir -p artifacts
          cp ../threshold_*.deb ../msi-ec-dkms_*.deb artifacts/

      - name: Lintian
        run: lintian artifacts/*.deb

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: threshold-deb-debian-13
          path: artifacts/*.deb
          retention-days: 14
          if-no-files-found: error

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: threshold-build-debian-13
          path: builddir/
          retention-days: 7
