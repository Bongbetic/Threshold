name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            pkg-config \
            desktop-file-utils \
            gettext \
            gobject-introspection \
            python3 \
            python3-gi \
            python3-pytest \
            python3-pytest-cov \
            flake8 \
            appstream \
            libgtk-4-dev \
            libadwaita-1-dev \
            gir1.2-notify-0.7

      - name: Configure
        run: meson setup builddir

      - name: Compile
        run: meson compile -C builddir

      - name: Test
        run: meson test -C builddir --print-errorlogs

      - name: Coverage (battery.py >= 80%)
        run: |
          PYTHONPATH=src python3 -m pytest tests/test_battery.py tests/test_window_ui.py -q \
            --cov=threshold.battery \
            --cov-fail-under=80 \
            --cov-report=term-missing

      - name: Lint
        run: flake8 src/threshold tests

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: threshold-build-${{ matrix.os }}
          path: builddir/
          retention-days: 7

  deb-package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev lintian

      - name: Install build dependencies
        run: |
          sudo apt-get build-dep -y .

      - name: Build .debs
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p artifacts
          cp ../threshold_*.deb artifacts/

      - name: Lintian
        run: lintian artifacts/*.deb

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: threshold-deb-${{ matrix.os }}
          path: artifacts/*.deb
          retention-days: 14
          if-no-files-found: error

  debian-13:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            passwd \
            util-linux \
            meson \
            ninja-build \
            pkg-config \
            desktop-file-utils \
            gettext \
            gobject-introspection \
            python3 \
            python3-gi \
            python3-pytest \
            python3-pytest-cov \
            flake8 \
            appstream \
            libgtk-4-dev \
            libadwaita-1-dev \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            gir1.2-notify-0.7 \
            dpkg-dev \
            debhelper-compat \
            dh-python \
            dkms \
            lintian

      - name: Prepare non-root build user
        run: |
          useradd --create-home ci
          chown -R ci:ci "$GITHUB_WORKSPACE"
          chown ci:ci "$(dirname "$GITHUB_WORKSPACE")"

      - name: Configure
        run: runuser -u ci -- meson setup builddir

      - name: Compile
        run: runuser -u ci -- meson compile -C builddir

      - name: Test
        run: runuser -u ci -- meson test -C builddir --print-errorlogs

      - name: Coverage (battery.py >= 80%)
        run: |
          runuser -u ci -- env PYTHONPATH=src python3 -m pytest \
            tests/test_battery.py tests/test_window_ui.py -q \
            --cov=threshold.battery \
            --cov-fail-under=80 \
            --cov-report=term-missing

      - name: Lint
        run: runuser -u ci -- flake8 src/threshold tests

      - name: Build .debs
        run: |
          runuser -u ci -- dpkg-buildpackage -us -uc -b
          mkdir -p artifacts
          cp ../threshold_*.deb artifacts/

      - name: Lintian
        run: lintian artifacts/*.deb

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: threshold-deb-debian-13
          path: artifacts/*.deb
          retention-days: 14
          if-no-files-found: error

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: threshold-build-debian-13
          path: builddir/
          retention-days: 7

  rpm-package:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        fedora: ['43', '44']
    container: fedora:${{ matrix.fedora }}
    steps:
      - name: Install build dependencies
        run: |
          dnf -y install git rpm-build \
            meson ninja-build pkgconf-pkg-config gettext blueprint-compiler \
            gtk4-devel libadwaita-devel python3-devel python3-gobject \
            desktop-file-utils libappstream-glib systemd-rpm-macros

      - uses: actions/checkout@v4

      - name: Build SRPM and RPMs
        run: |
          V=$(sed -n "s/.*version: '\([0-9.]*\)'.*/\1/p" meson.build | head -1)
          mkdir -p rpmbuild/{SOURCES,SPECS,RPMS,SRPMS,BUILD}
          tar --exclude=.git --exclude=rpmbuild --transform "s,^\.,Threshold-$V," \
              -czf rpmbuild/SOURCES/Threshold-$V.tar.gz .
          cp packaging/threshold.sysusers rpmbuild/SOURCES/
          cp packaging/threshold.spec rpmbuild/SPECS/
          rpmbuild -ba --define "_topdir $PWD/rpmbuild" rpmbuild/SPECS/threshold.spec

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp rpmbuild/RPMS/noarch/*.rpm artifacts/
          ls -l artifacts/

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: threshold-rpm-fedora-${{ matrix.fedora }}
          path: artifacts/*.rpm
          retention-days: 14
          if-no-files-found: error

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: cd web && npm ci

      - name: TypeScript check
        run: cd web && npx tsc --noEmit

      - name: Lint
        run: cd web && npx eslint src/ test/

      - name: Unit tests
        run: cd web && npx vitest run

      - name: Production build
        run: cd web && npm run build

      - name: Verify bundle is committed
        run: |
          if [ -n "$(git status --porcelain web/dist/)" ]; then
            echo "::error::web/dist/ is stale. Rebuild with: cd web && npm run build"
            git status --short web/dist/
            exit 1
          fi

      - name: Reject runtime HTTP references
        run: |
          if grep -rn 'https\?://[^w]' web/dist/ --include='*.js' --include='*.css' --include='*.html' | grep -v 'w3.org'; then
            echo "::error::Bundle contains runtime HTTP references"
            exit 1
          fi

      - name: Verify fonts bundled
        run: |
          if ! ls web/dist/fonts/*.woff2 >/dev/null 2>&1; then
            echo "::error::IBM Plex fonts not found in web/dist/fonts/"
            exit 1
          fi

  bundle-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Python test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pytest

      - name: Verify bundle completeness
        run: PYTHONPATH=src python3 -m pytest tests/test_web_bundle.py -v

      - name: Xvfb smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb gir1.2-webkit-6.0
          PYTHONPATH=src xvfb-run -a python3 -m pytest tests/test_carbon_xvfb.py -v
