name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            pkg-config \
            desktop-file-utils \
            gettext \
            gobject-introspection \
            python3 \
            python3-gi \
            python3-pytest \
            python3-pytest-cov \
            flake8 \
            blueprint-compiler \
            appstream \
            libgtk-4-dev \
            libadwaita-1-dev \
            gir1.2-ayatanaappindicatorglib-2.0 \
            gir1.2-notify-0.7

      - name: Configure
        run: meson setup builddir

      - name: Compile
        run: meson compile -C builddir

      - name: Test
        run: meson test -C builddir --print-errorlogs

      - name: Coverage (battery.py ≥ 80%)
        run: |
          PYTHONPATH=src python3 -m pytest tests/test_battery.py tests/test_window_ui.py -q \
            --cov=batteryguard.battery \
            --cov-fail-under=80 \
            --cov-report=term-missing

      - name: Lint
        run: flake8 src/batteryguard tests

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: batteryguard-build
          path: builddir/
          retention-days: 7

  deb-package:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev lintian

      - name: Install build dependencies
        run: sudo apt-get build-dep -y .

      - name: Build .deb
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p artifacts
          cp ../msi-batteryguard_*.deb artifacts/

      - name: Lintian
        run: lintian artifacts/msi-batteryguard_*.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi-batteryguard-deb
          path: artifacts/msi-batteryguard_*.deb
          retention-days: 14
          if-no-files-found: error
